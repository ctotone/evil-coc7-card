name: Foundry Catalog Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version déjà publiée dans GitHub Releases (ex: 1.3.2)"
        required: true
        type: string
      mode:
        description: "Validation seulement ou publication Foundry"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - publish

permissions:
  contents: read

jobs:
  register-foundry-release:
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier les assets GitHub de la release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          base="https://github.com/ctotone/evil-coc7-card/releases/download/${VERSION}"
          curl --fail --location --silent --show-error --head "${base}/module.json"
          curl --fail --location --silent --show-error --head "${base}/evil-coc7-card.zip"

      - name: Enregistrer la version dans le catalogue Foundry
        env:
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${FOUNDRY_RELEASE_TOKEN:-}" ]; then
            echo "Secret FOUNDRY_RELEASE_TOKEN absent."
            exit 1
          fi

          if [ "${MODE}" = "dry-run" ]; then
            dry_run=true
          else
            dry_run=false
          fi

          manifest="https://github.com/ctotone/evil-coc7-card/releases/download/${VERSION}/module.json"
          notes="https://github.com/ctotone/evil-coc7-card/releases/tag/${VERSION}"

          payload=$(cat <<JSON
          {
            "id": "evil-coc7-card",
            "dry-run": ${dry_run},
            "release": {
              "version": "${VERSION}",
              "manifest": "${manifest}",
              "notes": "${notes}",
              "compatibility": {
                "minimum": "13",
                "verified": "14"
              }
            }
          }
          JSON
          )

          curl --fail-with-body --silent --show-error             -X POST             -H "Content-Type: application/json"             -H "Authorization: ${FOUNDRY_RELEASE_TOKEN}"             --data "${payload}"             "https://foundryvtt.com/_api/packages/release_version/"
